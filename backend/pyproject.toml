[project]
name = "miabe-backend"
version = "0.1.0"
description = "API FastAPI du portail MIABÉ CTF"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "fastapi[standard]==0.162.2",
    "httpx==0.28.1",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# B008 : les appels dans les valeurs par défaut sont le mécanisme Depends de FastAPI.
ignore = ["B008"]

[tool.ruff.lint.isort]
# Le dossier local alembic/ ne doit pas masquer le paquet du même nom.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
