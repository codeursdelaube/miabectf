# Environnement de développement. Supabase est lancé séparément avec `supabase start`.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ctfd:
    image: ctfd/ctfd:3.8.9
    environment:
      SECRET_KEY: ${CTFD_SECRET_KEY:?definir CTFD_SECRET_KEY}
    ports:
      - "8001:8000"
    volumes:
      - ctfd-data:/var/uploads
      - ctfd-db:/opt/CTFd/CTFd/.data

volumes:
  redis-data:
  ctfd-data:
  ctfd-db:
